name: Publish Python package to PyPI
# Trusted Publishing (OIDC): no PyPI token is stored in this repo.
# Runs only on a pushed tag like python-v0.2.0; the tag must match python/pyproject.toml's version.
on:
  push:
    tags: ["python-v*"]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tag matches the package version
        run: |
          v=$(python -c "import tomllib;print(tomllib.load(open('python/pyproject.toml','rb'))['project']['version'])")
          if [ "${GITHUB_REF_NAME}" != "python-v${v}" ]; then echo "tag ${GITHUB_REF_NAME} does not match version ${v}"; exit 1; fi
      - run: python -m pip install -e "python[test]" build
      - run: python -m pytest -q python/tests
        env:
          APIFY_TOKEN: ""
      - run: python -m build python --outdir dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/etsy-sales-mcp
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
