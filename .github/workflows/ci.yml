name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --no-audit --no-fund
      # Tests run with no Apify token and no network access to Apify.
      # test/env-guard.test.js fails the suite if APIFY_TOKEN is set.
      - run: npm test
        env:
          APIFY_TOKEN: ""
  tools-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      # Self-test: the check must go red (exit 1) on the committed mismatch fixture.
      - name: Drift check goes red on the fixture
        run: |
          set +e
          node scripts/build-tools.mjs --check --tools test/fixtures/tools.drift-fixture.json
          rc=$?
          if [ "$rc" -ne 1 ]; then echo "drift check did not go red on the fixture (exit $rc)"; exit 1; fi
      # Fails if tools.json no longer matches the Actors' live public input schemas (public API, no token).
      - run: node scripts/build-tools.mjs --check
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e "python[test]"
      # Same token hold as the Node tests: python/tests/test_env_guard.py fails if APIFY_TOKEN is set.
      - run: python -m pytest -q python/tests
        env:
          APIFY_TOKEN: ""
      # The Python drift check must go red on the committed mismatch fixture...
      - name: Python drift check goes red on the fixture
        run: |
          set +e
          python python/scripts/build_tools.py --check --tools test/fixtures/tools.drift-fixture.json
          rc=$?
          if [ "$rc" -ne 1 ]; then echo "python drift check did not go red on the fixture (exit $rc)"; exit 1; fi
      # ...and pass on the bundled tools.json against the live public input schemas (public API, no token).
      - run: python python/scripts/build_tools.py --check
      - name: Build sdist and wheel
        run: python -m pip install build && python -m build python --outdir dist
